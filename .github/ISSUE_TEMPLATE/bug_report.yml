name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: textarea
    id: summary
    attributes: { label: Summary, description: What happened and what did you expect? }
    validations: { required: true }
  - type: input
    id: versions
    attributes: { label: Versions, description: Hog OS 5, Companion, module, OS, and transport/interface versions }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Use a non-production show and omit sensitive data. }
    validations: { required: true }
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I reproduced this outside live production.
          required: true
        - label: I removed credentials and private show data.
          required: true
